# Used only by the Playwright run, never the default dev stack. The e2e suite registers, verifies
# and signs in many accounts from one host address and polls /live heavily, which the production
# identity and anonymous-read limits (brief 12.2, NFR-22) would throttle. Bring the stack up with
# this file and docker-compose.isolated.yml (the e2e data, never the development database); the
# default `docker compose up` keeps the production limits and the development data.
#   docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.isolated.yml -f docker-compose.e2e.yml up -d
services:
  api:
    environment: &e2e-limits
      E2E_STACK: "1"   # marks this stack: `python -m app.cli seed-demo` refuses to run on it
      DEMO_MODE: "false"   # the suite expects demo mode off (a local .env may turn it on for a recording); the demo endpoints are routed in the browser
      RATE_LIMIT_REGISTER_IP: "5000/3600"
      RATE_LIMIT_VERIFY_IP: "5000/3600"
      RATE_LIMIT_LOGIN_IP: "1000/60"
      RATE_LIMIT_FORGOT_IP: "5000/3600"   # the 4004 spec resets a password per run
      RATE_LIMIT_RESET_IP: "5000/3600"
      RATE_LIMIT_ANON_READ_IP: "2000/1"
  api-2:
    environment: *e2e-limits
