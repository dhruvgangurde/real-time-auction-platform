name: auction

services:
  postgres:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    # AOF + noeviction: live state and the bid outbox survive restarts and are never evicted
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: alembic upgrade head
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    # X-Forwarded-For is trusted only from the web proxy's fixed address (NFR-22): a client that
    # reaches the api directly cannot choose the address its rate limits key on
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --ws-max-size 65536 --ws-ping-interval 20 --ws-ping-timeout 20 --proxy-headers --forwarded-allow-ips=${WEB_PROXY_IP:-10.201.0.10}
    env_file: .env
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      - media:/media  # re-encoded auction images (D10), served read-only under /media
    networks: [default, edge]
    # no host port here: in development docker-compose.override.yml publishes API_HOST_PORT
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    # schedule file in /tmp so nothing lands in the mounted repo
    command: celery -A app.workers.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

networks:
  # the web proxy's network; its fixed address is the only one the api trusts for X-Forwarded-For
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-10.201.0.0/24}

volumes:
  pgdata:
  redisdata:
  media:
