name: auction

services:
  postgres:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    # AOF + noeviction: live state and the bid outbox survive restarts and are never evicted
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: alembic upgrade head
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  # two api instances behind the web service (NFR-5): the hub, presence, sessions, limits and
  # idempotency records are all in Redis, so either instance can take any request or socket
  api: &api
    build: ./backend
    # X-Forwarded-For is trusted only from the web proxy's fixed address (NFR-22): a client that
    # reaches the api directly cannot choose the address its rate limits key on
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --ws-max-size 65536 --ws-ping-interval 20 --ws-ping-timeout 20 --proxy-headers --forwarded-allow-ips=${WEB_PROXY_IP:-10.201.0.10}
    env_file: .env
    environment: &api-env
      WATCHFILES_FORCE_POLLING: "true"
      # the web origin joins the WebSocket Origin allowlist unless .env sets its own
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8011}
      # demo mode (brief 12.3): .env or the shell turns it on; off, every demo route is a 404
      DEMO_MODE: ${DEMO_MODE:-false}
      INSTANCE_NAME: api  # this instance in the admin overview (NFR-8)
    volumes:
      - ./backend:/app
      - media:/media  # one volume for both instances: an upload is served by either (D10)
    networks: [default, edge]
    # no host port here: in development docker-compose.override.yml publishes API_HOST_PORT
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  api-2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_NAME: api-2

  # the front door (brief 12.5): the built SPA, and /api (with the WebSocket upgrade) and /media
  # balanced across both api instances, with the CSP and security headers
  web:
    image: nginx:1.28.0-alpine
    environment:
      WEB_WS_ORIGIN: ${WEB_WS_ORIGIN:-ws://localhost:8011}
    volumes:
      - ./web/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./frontend/dist:/usr/share/nginx/html:ro  # empty until the SPA is built (Phase 10c)
    ports:
      # loopback only until deployment (audit M4): a reverse proxy on the same host still reaches it
      - "127.0.0.1:${WEB_HOST_PORT:-8011}:80"
    networks:
      edge:
        ipv4_address: ${WEB_PROXY_IP:-10.201.0.10}  # the one address the api trusts
    depends_on:
      - api
      - api-2

  worker:
    build: ./backend
    user: app  # not root (Phase 11 hardening): the worker needs no privilege
    # pinned: Celery's default is one prefork process per CPU (32 on the dev laptop), each with
    # its own SQLAlchemy pool, more than Postgres's 100 connections (docs/decisions.md)
    command: celery -A app.workers.celery_app worker --loglevel=info -c ${CELERY_CONCURRENCY:-4}
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    user: app  # not root: beat writes only its schedule, in /tmp
    # schedule file in /tmp so nothing lands in the mounted repo
    command: celery -A app.workers.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # demo mode's runner (brief 12.3, 12.4): the bots of "Try to break it". Started only with the
  # profile (docker compose --profile demo up -d) and refuses to run unless DEMO_MODE is on.
  demo:
    build: ./backend
    profiles: [demo]
    command: python -m app.workers.demo_runner
    env_file: .env
    environment:
      DEMO_MODE: ${DEMO_MODE:-false}
      # one lot per run, by the demo seller; a person's limit stays 10 per hour (NFR-22)
      RATE_LIMIT_AUCTION_CREATE: "60/3600"
    volumes:
      - ./backend:/app
      - media:/media  # the lot's photo, served by the api like any upload (D10)
    mem_limit: 256m
    cpus: 1.0
    restart: on-failure
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      api:
        condition: service_started
      api-2:
        condition: service_started

  # OR-6: a daily logical backup kept seven days, and the images (backend/scripts/backup.sh): the
  # postgres image, so pg_dump matches the server. The files go to a host folder outside the
  # repository, which `docker compose down -v` does not delete; restore: scripts/restore-drill.sh
  backup:
    image: postgres:16
    env_file: .env
    entrypoint: ["bash", "/scripts/backup.sh"]
    volumes:
      - ./backend/scripts:/scripts:ro
      - media:/media:ro
      - ${BACKUP_DIR:-../auction-private/backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  # the web proxy's network; its fixed address is the only one the api trusts for X-Forwarded-For
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-10.201.0.0/24}

volumes:
  pgdata:
  redisdata:
  media:
