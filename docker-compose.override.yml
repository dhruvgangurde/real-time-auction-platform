# Local development only: expose Postgres and Redis on the host.
# 5432 and 6379 are not used because another project owns 5432 (and 8000).
services:
  # direct access to the first api instance (Swagger, curl); its peer is the Docker gateway, which
  # is not trusted for X-Forwarded-For, so a header sent here is ignored
  api:
    ports:
      - "${API_HOST_PORT:-8010}:8000"
    # the Playwright suites (frontend/e2e) register, verify and sign in many accounts from one
    # address per run; the identity limits keep their defaults everywhere but this dev override
    environment: &e2e-identity-limits
      RATE_LIMIT_REGISTER_IP: "100/3600"
      RATE_LIMIT_VERIFY_IP: "200/3600"
      RATE_LIMIT_LOGIN_IP: "100/60"
  api-2:
    environment: *e2e-identity-limits
  postgres:
    ports:
      - "${POSTGRES_HOST_PORT:-5442}:5432"
  redis:
    ports:
      - "${REDIS_HOST_PORT:-6389}:6379"
  # development SMTP sink (SI-4, TBD-1 stays open): SMTP on mailpit:1025 inside the network,
  # every sent email readable in the web UI on the host
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"
