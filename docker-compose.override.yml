# Local development only: publish the API, Postgres, Redis and Mailpit on the host, every one on loopback
# only (127.0.0.1), so nothing is reachable from the network (Mailpit shows password-reset links; audit M4).
# 5432 and 6379 are not used because another project owns 5432 (and 8000).
services:
  # direct access to the first api instance (Swagger, curl); its peer is the Docker gateway, which
  # is not trusted for X-Forwarded-For, so a header sent here is ignored
  api:
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8010}:8000"
    volumes:
      # local demo only: seed-demo writes demo-credentials.md here, outside the repository
      - ${DEMO_PRIVATE_DIR:-../auction-private}:/private
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5442}:5432"
  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6389}:6379"
  # development SMTP sink (SI-4, TBD-1 stays open): SMTP on mailpit:1025 inside the network,
  # every sent email readable in the web UI on the host
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"
