# The load test (Phase 11, loadtest/README.md): k6 from the official image, and the backend
# image as the tools that set the test up and check it afterwards, on the dev stack's networks.
# Used only with this file, docker-compose.isolated.yml and the profile (never with the e2e overlay):
#   docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.isolated.yml -f docker-compose.loadtest.yml --profile loadtest run --rm k6 run /loadtest/room.js
# The application's limits stay at their production values. Any limit the test had to raise
# would be set here, with its reason, and listed in loadtest/RESULTS.md: none so far.
services:
  k6:
    image: grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34
    profiles: [loadtest]
    # the image's own user cannot write to the bind mount, where k6 leaves its log and summary
    user: root
    volumes:
      - ./loadtest:/loadtest
    working_dir: /loadtest
    # the web service's network: the sockets and requests come in through the front door, as a
    # browser's do, and nginx spreads them over both api instances
    networks: [edge]

  loadtest-tools:
    build: ./backend
    profiles: [loadtest]
    env_file: .env
    # the isolated stack's data (docker-compose.isolated.yml), never the development database
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-auction_app}:${APP_DB_PASSWORD:-auction_app}@postgres:5432/auction_e2e
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-auction}:${POSTGRES_PASSWORD:-auction}@postgres:5432/auction_e2e
      REDIS_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/3
    volumes:
      - ./backend:/app
      - ./loadtest:/loadtest  # the plan (tokens included) and the run's records, in loadtest/.run/
      - media_e2e:/media  # the lot's photo, served by the isolated api like any upload
      - ./ops:/ops:ro  # the newest restore drill's evidence, for OR-6's row
      - ./docs:/docs:ro  # the verification matrix, for OR-12's row
    networks: [default]

volumes:
  media_e2e:
