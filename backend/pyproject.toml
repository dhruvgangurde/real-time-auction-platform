[project]
name = "auction-backend"
version = "0.1.0"
description = "Real-Time Auction Platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "celery>=5.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "watchfiles>=0.22",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "email-validator>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "hypothesis>=6.100",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# one loop for the whole session so session-scoped async fixtures stay attached
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection is declared in defaults by design
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Cookie", "fastapi.Query", "app.api.deps.require_roles"]

[tool.ruff.lint.isort]
# the local alembic/ folder shadows the alembic package name
known-third-party = ["alembic"]
